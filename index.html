<!doctype html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Հարսանյաց հրավեր</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://c.webfontfree.com/c.js?f=ArTarumianErevan"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@font-face{font-family:"Emin Script";src:url("https://fonter.am/fonts/download/emin-script") format("truetype");font-style:normal;font-weight:400;font-display:swap;}
body{background:#f5efe4;color:#394638;font-family:'Noto Serif Armenian',serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 70%,#fff 0 1px,transparent 1.5px);background-size:42px 42px,58px 58px}
.opening{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at center,#fffdf9 0%,#f7f0e5 55%,#e7ddcd 100%);transition:1s ease}
.opening.hide{opacity:0;visibility:hidden;pointer-events:none}
.wrap{width:94vw;text-align:center}
.title{font-size:21px;letter-spacing:1px;color:#4e5a43;margin-bottom:35px;font-weight:500}
.envelope{position:relative;width:min(90vw,650px);aspect-ratio:1.62/1;margin:auto;cursor:pointer;filter:drop-shadow(0 28px 35px rgba(62,49,31,.18));perspective:1400px}
.base{position:absolute;inset:0;background:linear-gradient(145deg,#faf7f1,#eee5d8 55%,#ddd0be);overflow:hidden;border:1px solid rgba(100,83,58,.12)}
.card{position:absolute;z-index:2;left:8%;top:7%;width:84%;height:87%;background:#fffdfa;display:grid;place-items:center;box-shadow:0 8px 25px rgba(60,45,28,.12);transform:translateY(25px);transition:1.4s}
.card div{text-align:center}
.small{font-size:16px;color:#8d7b60;margin-bottom:10px}
.inside{font-size:46px;font-weight:600;color:#3e5145}
.left{position:absolute;z-index:4;inset:0 auto 0 0;width:52%;background:linear-gradient(145deg,#f9f5ef,#e1d6c6);clip-path:polygon(0 0,100% 50%,0 100%)}
.right{position:absolute;z-index:4;inset:0 0 0 auto;width:52%;background:linear-gradient(215deg,#f9f5ef,#e1d6c6);clip-path:polygon(100% 0,0 50%,100% 100%)}
.bottom{position:absolute;z-index:5;inset:auto 0 0;width:100%;height:70%;background:linear-gradient(145deg,#eee7dc,#d8cbb9);clip-path:polygon(0 100%,50% 19%,100% 100%)}
.top{position:absolute;z-index:10;inset:0 0 auto;width:100%;height:68%;background:linear-gradient(135deg,#fcfaf6,#f0e7da 55%,#ded1bf);clip-path:polygon(0 0,100% 0,50% 94%);transform-origin:top;transition:1.35s}
.stamp{position:absolute;z-index:50;left:50%;top:53%;width:150px;height:150px;object-fit:contain;transform:translate(-50%,-50%) rotate(-4deg);mix-blend-mode:multiply;filter:contrast(1.08) saturate(1.08) drop-shadow(0 9px 8px rgba(67,45,22,.22));transition:.6s}
.envelope.open .top{transform:rotateX(180deg)}
.envelope.open .stamp{opacity:0;transform:translate(-50%,-50%) scale(.65) rotate(12deg)}
.envelope.open .card{transform:translateY(-38%)}
.open{font-size:22px;margin-top:32px;color:#52604c}
.hint{font-size:12px;color:#9b8d7b;margin-top:8px}
.main{display:none}
.main.show{display:block}
.section{position:relative;padding:115px 20px;text-align:center;overflow:hidden}
.hero{min-height:100vh;display:grid;place-items:center;background:linear-gradient(#f7f1e7,#f3ecdf)}
.decor{position:absolute;width:150px;height:150px;opacity:.38;pointer-events:none}
.decor svg{width:100%;height:100%;stroke:#7a825f;fill:none;stroke-width:1.2;stroke-linecap:round}
.decor.tl{left:-20px;top:20px;transform:rotate(-20deg)}
.decor.br{right:-20px;bottom:20px;transform:rotate(160deg)}
.monogram{width:190px;height:190px;border:1px solid #b7a58c;border-radius:50%;display:grid;place-items:center;margin:0 auto 35px;background:rgba(255,255,255,.2)}
.monogram span{font-size:39px;color:#405143;text-align:center;line-height:1.3}
.names{font-family:'Emin Script','Noto Serif Armenian',serif;font-size:clamp(58px,8vw,100px);font-weight:400;font-style:normal;letter-spacing:1px;color:#252c27;line-height:1.08;white-space:nowrap;text-shadow:none;transform:none;transform-origin:center}
.names::first-letter{font-style:normal}
.hero .names{position:relative;margin:18px auto 4px;display:inline-block}
.hero .names::before{content:'&';position:absolute;left:50%;top:50%;transform:translate(-50%,-48%) rotate(-8deg);font-family:Georgia,'Times New Roman',serif;font-size:1.65em;font-weight:400;color:rgba(120,125,116,.16);z-index:0;pointer-events:none}
.hero .names{z-index:1}
.hero .names{background:transparent}
.hero .names{letter-spacing:1px}
.footer .names{font-style:normal;transform:none;white-space:normal}
.line{width:70px;height:1px;background:#b9a78d;margin:25px auto}
.date{font-size:24px;letter-spacing:4px;color:#746d60}
.eyebrow{font-size:18px;color:#8b7a61;margin-bottom:13px}
.intro{background:#fbf7ef}
.intro h2,.events h2,.countdown h2,.rsvp h2{font-size:46px;font-weight:500;color:#43503f}
.intro p{max-width:650px;margin:25px auto;line-height:2.1;font-size:17px;color:#6f7068}
.events{background:#e9e0d2}
.events .grid{max-width:1050px;margin:55px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.event{position:relative;overflow:hidden;padding:45px 25px;background:rgba(255,253,248,.62);border:1px solid rgba(128,108,78,.15);box-shadow:0 10px 25px rgba(74,58,38,.06)}
.event h3{font-size:31px;font-weight:500;margin:16px 0 9px;color:#43503f}
.event p{font-size:16px;color:#707168}
.event .number{font-size:18px;color:#a18a63;margin-bottom:14px}
.sticker-slot{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;border:1px dashed #bca983;background:rgba(255,255,255,.34);display:grid;place-items:center;color:#b09a70;font-size:13px;padding:10px}
.sticker-slot img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.slot-note{font-size:10px!important;color:#9c927f!important;margin-top:6px}
.map{display:inline-flex;align-items:center;justify-content:center;min-width:145px;margin-top:18px;padding:10px 18px;border:1px solid #a99a80;border-radius:999px;color:#5f6855;font-size:12px;text-decoration:none;background:rgba(255,253,248,.55);transition:.3s ease}.map:hover{background:#59644c;color:#fffaf1;border-color:#59644c;transform:translateY(-2px)}
.countdown{background:#59644c;color:#fffaf1}
.countdown h2{color:#fffaf1}
.times{display:flex;justify-content:center;gap:65px;margin-top:50px}
.time strong{display:block;font-size:57px;font-weight:400}
.time span{font-size:11px;letter-spacing:2px;color:#e8dfd0}
.rsvp{background:#f8f2e7}
.form{width:min(720px,94vw);margin:45px auto 0;text-align:left}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.group{margin-bottom:18px}
.group label{display:block;font-size:13px;color:#596052;margin-bottom:8px}
.group input,.group select{width:100%;height:52px;border:1px solid #cdbfa9;background:#fffaf2;color:#4a5148;padding:0 14px;font-family:inherit;font-size:14px;outline:none}
.group.full{grid-column:1/-1}
.music-box{border:1px dashed #b8a887;padding:20px;background:#fffaf2}
.music-box input{height:auto;border:0;background:transparent;padding:0}
.music-box audio{width:100%;margin-top:14px;display:none}
.submit{display:block;width:min(390px,100%);height:55px;margin:12px auto 0;border:0;background:#59644c;color:#fffaf1;font-family:inherit;font-size:13px;cursor:pointer}
.footer{background:#f3ecdf;text-align:center;padding:90px 20px 45px}
.footer h2{font-size:42px;font-weight:500;color:#3e4b3e}
.footer .names{font-size:34px;margin-top:12px;color:#8e795e}
.contacts{margin-top:45px;font-size:11px;line-height:2.5;color:#8f8575}
.contacts a{color:inherit;text-decoration:none}

@media(max-width:700px){
 .title{font-size:18px;margin-bottom:24px}
 .stamp{width:110px;height:110px}
 .inside{font-size:31px}
 .small{font-size:12px}
 .monogram{width:150px;height:150px}
 .monogram span{font-size:29px}
 .names{font-size:48px;letter-spacing:.5px}
 .section{padding:85px 20px}
 .events .grid{grid-template-columns:1fr;gap:20px}
 .times{gap:30px}
 .time strong{font-size:40px}
 .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Աուդիո նվագարկիչ (Թաքնված է, կմիանա կոճակը սեղմելիս) -->
<audio id="bgMusic" src="/wedding.mp3" preload="auto" loop></audio>

<!-- Բացման էջ (Ծրար) -->
<div class="opening" id="openingScreen">
    <div class="wrap">
        <h1 class="title">ՀԱՐՍԱՆՅԱՑ ՀՐԱՎԵՐ</h1>
        <div class="envelope" id="envelopeBtn">
            <div class="base"></div>
            <div class="left"></div>
            <div class="right"></div>
            <div class="bottom"></div>
            <div class="top"></div>
            <img src="https://unsplash.com" alt="stamp" class="stamp">
            <div class="card">
                <div>
                    <p class="small">Սիրով հրավիրում ենք</p>
                    <p class="inside">Ձեզ</p>
                </div>
            </div>
        </div>
        <p class="open">Բացել հրավիրատոմսը</p>
        <p class="hint">(Սեղմեք ծրարի վրա)</p>
    </div>
</div>

<!-- Կայքի հիմնական բովանդակությունը -->
<div class="main" id="mainContent">
    <section class="section hero">
        <div class="decor tl">
            <svg viewBox="0 0 100 100"><path d="M10,90 Q50,50 90,10 M30,70 Q60,40 80,20"/></svg>
        </div>
        <div>
            <div class="monogram">
                <span>Ա & Մ</span>
            </div>
            <h2 class="names">Արմեն & Մարիամ</h2>
            <div class="line"></div>
            <p class="date">25.07.2026</p>
        </div>
        <div class="decor br">
            <svg viewBox="0 0 100 100"><path d="M10,90 Q50,50 90,10 M30,70 Q60,40 80,20"/></svg>
        </div>
    </section>
