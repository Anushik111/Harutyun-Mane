<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Հարսանյաց հրավեր</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Playfair+Display:ital,wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 18% 20%,
            rgba(255,255,255,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 82% 75%,
            rgba(255,255,255,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #9baec1,
            #8299b0
        );

    color:#63778d;
    font-family:"Manrope",sans-serif;
}


/* =========================
   BACKGROUND LIGHT
========================= */

.bg-glow{
    position:fixed;
    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    filter:blur(55px);

    pointer-events:none;

    animation:glowMove 9s ease-in-out infinite alternate;
}

.bg-glow.one{
    top:-180px;
    left:-120px;
}

.bg-glow.two{
    right:-120px;
    bottom:-220px;

    animation-delay:2s;
}

@keyframes glowMove{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(35px,25px) scale(1.12);
    }
}


/* =========================
   MAIN
========================= */

.invitation{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:35px 15px;

    position:relative;
}


/* =========================
   PAPER
========================= */

.paper{
    width:min(620px,94vw);
    min-height:760px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:105px 70px;

    isolation:isolate;
}


/* =========================
   PAPER SHAPE
========================= */

.paper::before{
    content:"";

    position:absolute;

    inset:34px;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.85),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #f8f6ef,
            #eeeae0
        );

    box-shadow:
        0 25px 70px rgba(49,67,86,.25),
        inset 0 0 35px rgba(120,115,100,.08);

    z-index:-2;

    clip-path:polygon(
        5% 3%,
        12% 1%,
        19% 4%,
        27% 1%,
        35% 4%,
        43% 1%,
        51% 4%,
        59% 1%,
        67% 4%,
        75% 1%,
        83% 4%,
        91% 1%,
        97% 6%,
        95% 14%,
        98% 22%,
        95% 30%,
        98% 38%,
        95% 46%,
        98% 54%,
        95% 62%,
        98% 70%,
        95% 78%,
        98% 86%,
        94% 94%,
        86% 96%,
        78% 94%,
        70% 97%,
        62% 94%,
        54% 97%,
        46% 94%,
        38% 97%,
        30% 94%,
        22% 97%,
        14% 94%,
        6% 97%,
        2% 91%,
        5% 83%,
        2% 75%,
        5% 67%,
        2% 59%,
        5% 51%,
        2% 43%,
        5% 35%,
        2% 27%,
        5% 19%,
        2% 11%
    );
}


/* =========================
   LACE
========================= */

.lace{
    position:absolute;
    inset:0;

    z-index:-1;

    filter:
        drop-shadow(
            0 10px 12px rgba(48,66,84,.14)
        );
}

.lace::before,
.lace::after{
    content:"";

    position:absolute;

    border-radius:46%;

    border-style:dotted;

    border-color:rgba(249,247,239,.92);
}

.lace::before{
    inset:18px;

    border-width:12px;

    transform:rotate(2deg);
}

.lace::after{
    inset:28px;

    border-width:7px;

    transform:rotate(-2deg);
}


/* =========================
   DECORATIVE FLOWERS
========================= */

.flower{
    position:absolute;

    width:52px;
    height:52px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0 8%,
            transparent 9%
        ),
        repeating-conic-gradient(
            from 0deg,
            rgba(250,248,240,.95) 0deg 12deg,
            transparent 12deg 24deg
        );

    opacity:.88;

    animation:
        flowerFloat 5s ease-in-out infinite;
}

.f1{
    top:20px;
    left:50%;

    transform:translateX(-50%);
}

.f2{
    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    animation-delay:1.4s;
}

.f3{
    left:20px;
    top:50%;

    transform:translateY(-50%);

    animation-delay:2.3s;
}

.f4{
    right:20px;
    top:50%;

    transform:translateY(-50%);

    animation-delay:3.1s;
}

@keyframes flowerFloat{
    0%,
    100%{
        margin-top:0;
        rotate:0deg;
    }

    50%{
        margin-top:-7px;
        rotate:5deg;
    }
}


/* ==================================================
   ՄԻԱՅՆ ՀՐԱՎԻՐԵԼՈՒ ՏԵՔՍՏԻ ՍՊԻՏԱԿ ՇՐՋԱՆԱԿ
================================================== */

.invitation-text-box{
    position:relative;

    width:100%;
    max-width:455px;

    margin:0 auto;

    padding:43px 38px 38px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(248,247,242,.96)
        );

    border:1px solid rgba(255,255,255,.98);

    border-radius:10px;

    box-shadow:
        0 12px 35px rgba(65,82,100,.12),
        inset 0 0 25px rgba(120,125,130,.055);

    outline:
        1px solid rgba(255,255,255,.88);

    outline-offset:8px;

    opacity:0;

    animation:
        invitationBoxIn
        1.15s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* Ներսի նուրբ եզրագիծ */

.invitation-text-box::before{
    content:"";

    position:absolute;

    inset:11px;

    border:
        1px solid
        rgba(104,124,145,.18);

    border-radius:6px;

    pointer-events:none;
}


/* Վերևի փոքր դեկոր */

.invitation-text-box::after{
    content:"✦";

    position:absolute;

    top:2px;
    left:50%;

    transform:translateX(-50%);

    padding:0 11px;

    background:#fff;

    color:#71859a;

    font-size:13px;

    z-index:3;
}


/* =========================
   TITLE
========================= */

.invitation-title{
    position:relative;

    z-index:2;

    text-align:center;

    color:#65798f;

    font-size:18px;

    letter-spacing:2px;

    margin-bottom:22px;

    opacity:0;

    animation:
        invitationTitleIn
        1s
        .25s
        ease
        forwards;
}


/* =========================
   MESSAGE
========================= */

.invitation-message{
    position:relative;

    z-index:2;

    max-width:370px;

    margin:auto;

    text-align:center;

    color:#708399;

    font-size:16px;

    line-height:1.9;

    font-weight:400;

    opacity:0;

    animation:
        invitationMessageIn
        1.2s
        .55s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================
   HIGHLIGHT
========================= */

.invitation-highlight{
    position:relative;

    z-index:2;

    margin-top:20px;

    text-align:center;

    color:#627890;

    font-size:16px;

    font-weight:600;

    opacity:0;

    animation:
        invitationHighlightIn
        1s
        .9s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================
   DATE
========================= */

.date{
    position:relative;

    margin-top:28px;

    text-align:center;

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-size:36px;

    line-height:1.2;

    color:#5f7892;

    opacity:0;

    animation:
        dateIn
        1.4s
        1.25s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================
   FROM
========================= */

.from{
    margin-top:23px;

    text-align:center;

    color:#71849a;

    font-size:16px;

    opacity:0;

    animation:
        fromIn
        1s
        1.65s
        ease
        forwards;
}


/* =========================
   NAMES
========================= */

.names{
    margin-top:8px;

    text-align:center;

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-size:32px;

    line-height:1.3;

    color:#5c7590;

    opacity:0;

    animation:
        namesIn
        1.5s
        1.9s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================
   DIFFERENT ANIMATIONS
========================= */

@keyframes invitationBoxIn{

    0%{
        opacity:0;

        transform:
            translateY(40px)
            scale(.94);

        filter:blur(5px);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


@keyframes invitationTitleIn{

    0%{
        opacity:0;

        transform:
            translateY(-20px);

        letter-spacing:8px;
    }

    100%{
        opacity:1;

        transform:
            translateY(0);

        letter-spacing:2px;
    }
}


@keyframes invitationMessageIn{

    0%{
        opacity:0;

        transform:
            translateX(-35px);
    }

    65%{
        transform:
            translateX(7px);
    }

    100%{
        opacity:1;

        transform:
            translateX(0);
    }
}


@keyframes invitationHighlightIn{

    0%{
        opacity:0;

        transform:
            scale(.65);
    }

    70%{
        transform:
            scale(1.06);
    }

    100%{
        opacity:1;

        transform:
            scale(1);
    }
}


@keyframes dateIn{

    0%{
        opacity:0;

        transform:
            translateY(35px)
            rotate(-7deg);
    }

    70%{
        transform:
            translateY(-5px)
            rotate(2deg);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            rotate(0);
    }
}


@keyframes fromIn{

    0%{
        opacity:0;

        transform:
            translateX(30px);
    }

    100%{
        opacity:1;

        transform:
            translateX(0);
    }
}


@keyframes namesIn{

    0%{
        opacity:0;

        transform:
            translateY(28px)
            scale(.72);

        filter:blur(5px);
    }

    70%{
        transform:
            translateY(-5px)
            scale(1.04);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .invitation{
        padding:15px 5px;
    }

    .paper{
        width:100%;
        min-height:690px;

        padding:
            92px
            50px;
    }

    .paper::before{
        inset:
            30px
            18px;
    }

    .lace::before{
        inset:15px;
    }

    .lace::after{
        inset:23px;
    }

    .flower{
        width:38px;
        height:38px;
    }

    .f1{
        top:22px;
    }

    .f2{
        bottom:22px;
    }

    .f3{
        left:13px;
    }

    .f4{
        right:13px;
    }


    /* միայն հրավերի սպիտակ հատվածը */

    .invitation-text-box{
        max-width:
            calc(100% - 10px);

        padding:
            35px
            24px
            32px;
    }

    .invitation-title{
        font-size:15px;

        letter-spacing:1.5px;

        margin-bottom:18px;
    }

    .invitation-message{
        font-size:14px;

        line-height:1.8;
    }

    .invitation-highlight{
        font-size:14px;

        line-height:1.6;
    }

    .date{
        font-size:29px;
    }

    .from{
        font-size:14px;
    }

    .names{
        font-size:27px;
    }
}
</style>
</head>


<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>


<main class="invitation">

    <div class="paper">

        <div class="lace"></div>

        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>


        <!-- ==========================================
             ՄԻԱՅՆ ՀՐԱՎԻՐԵԼՈՒ ՄԱՍԸ
        =========================================== -->

        <section class="invitation-text-box">

            <div class="invitation-title">
                ՍԻՐԵԼԻ ՀՅՈՒՐԵՐ
            </div>

            <div class="invitation-message">

                Մեր կյանքում կարևոր
                իրադարձություն է սպասվում․
                մենք ցանկանում ենք կիսվել
                այդ գեղեցիկ օրվա
                ուրախությամբ Ձեզ հետ։

            </div>

            <div class="invitation-highlight">

                Սպասում ենք Ձեզ մեր հարսանիքին

            </div>

        </section>


        <!-- DATE -->

        <div
            class="date"
            style="
                position:absolute;
                top:calc(50% + 205px);
                left:50%;
                transform:translateX(-50%);
                width:100%;
            "
        >
            13 փետրվարի 2027
        </div>


        <!-- FROM -->

        <div
            class="from"
            style="
                position:absolute;
                top:calc(50% + 270px);
                left:50%;
                transform:translateX(-50%);
                width:100%;
            "
        >
            Սիրով՝
        </div>


        <!-- NAMES -->

        <div
            class="names"
            style="
                position:absolute;
                top:calc(50% + 295px);
                left:50%;
                transform:translateX(-50%);
                width:100%;
            "
        >
            Արթուր և Մարի
        </div>

    </div>

</main>

</body>
</html>
